<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <pattern id="hachure" width="5" height="5" patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#c7cbd2"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#8a9099" stroke-width="1.6"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="12" fill="#f4ece0"
        stroke="#8a6a45" stroke-width="2"/>

  <!-- la planche -->
  <rect x="7" y="24" width="50" height="16" rx="1.5" fill="#d8b483"
        stroke="#5b4630" stroke-width="1.6"/>

  <!-- les pieces posees, separees par le trait de scie -->
  <rect x="9.5" y="26.5" width="15" height="11" fill="#6fd9bd"
        stroke="#3f6f60" stroke-width="1"/>
  <rect x="26" y="26.5" width="12" height="11" fill="#ef9a86"
        stroke="#8a4d3d" stroke-width="1"/>
  <!-- la chute -->
  <rect x="39.5" y="26.5" width="15" height="11" fill="url(#hachure)"
        stroke="#6b7078" stroke-width="1"/>
</svg>
